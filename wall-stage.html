function insetLoop(vertices, distance){
 const normals=vertices.map(([x,y],i)=>{
  const [nx,ny]=vertices[(i+1)%vertices.length];
  const dx=nx-x,dy=ny-y,len=Math.hypot(dx,dy)||1;
  return [-dy/len,dx/len];
 });
 return vertices.map(([x,y],i)=>{
  const p=normals[(i+vertices.length-1)%vertices.length],q=normals[i];
  const k=distance/Math.max(0.05,1+p[0]*q[0]+p[1]*q[1]);
  return [x+k*(p[0]+q[0]),y+k*(p[1]+q[1])];
 });
}

  const pxX=x=>(x-x0)*innerWidth/100/unit,pxY=y=>(y-y0)*innerHeight/100/unit;

  const roof=x=>pxY(a[1])+(x-pxX(a[0]))*(pxY(b[1])-pxY(a[1]))/(pxX(b[0])-pxX(a[0]));
  const leftRoof=Math.max(roof(L),roof(split))+8,rightRoof=Math.max(roof(split),roof(R))+8;
  const footerH=Math.min((split-L)*0.34,(base-leftRoof)*0.38);
  const footerTop=base-footerH;
  const queueW=split-L;
  const headerW=queueW*.47;
  const titleTop=footerTop;
  const titleH=footerH*.17;

  }
