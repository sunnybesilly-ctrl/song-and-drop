function valid(p){
 if(!Array.isArray(p)||p.length!==5||!p.every(v=>Array.isArray(v)&&v.length===2&&v.every(n=>Number.isFinite(n)&&n>=0&&n<=100)))return false;
 const [a,b,c,d,e]=p;
 return a[1]<b[1]&&a[1]<e[1]&&e[1]<d[1]&&Math.min(c[1],d[1])-Math.max(b[1],e[1])>10&&Math.min(b[0],c[0])-Math.max(a[0],d[0],e[0])>15;
}
try{const p=JSON.parse(localStorage.getItem(key));if(valid(p)){points=p;saved=true}}catch{}
const query=new URLSearchParams(location.search);
let editing=!saved||query.has('setup');query.delete('setup');
byId('show').src='index.html'+(query.toString()?'?'+query:'');
function insetLoop(vertices, distance){
 const normals=vertices.map(([x,y],i)=>{
  const [nx,ny]=vertices[(i+1)%vertices.length];
  const dx=nx-x,dy=ny-y,len=Math.hypot(dx,dy)||1;
  return [-dy/len,dx/len];
 });
 return vertices.map(([x,y],i)=>{
  const p=normals[(i+vertices.length-1)%vertices.length],q=normals[i];
  const k=distance/Math.max(0.05,1+p[0]*q[0]+p[1]*q[1]);
  return [x+k*(p[0]+q[0]),y+k*(p[1]+q[1])];
 });
}
function draw(){

 const span=Math.max(...pixels.map(p=>p[0]))-Math.min(...pixels.map(p=>p[0]));
 const tube=Math.max(1.2,Math.min(7,span*.005));
 byId('art').setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight);
 function drawTube(id,inset){
  const path=insetLoop(pixels,inset*tube).map(p=>p.join(',')).join(' ');
  Array.from(byId(id).children).forEach((line,i)=>{
   line.setAttribute('points',path);
   line.setAttribute('stroke-width',[2.8,1.65,.55][i]*tube);
  });
 }
 drawTube('outer',1.8);drawTube('inner',5.1);
 const [a,b,c,d,e]=insetLoop(pixels,7*tube).map(([x,y])=>[100*x/innerWidth,100*y/innerHeight]);
 const outline=points.map(p=>p[0]+'% '+p[1]+'%').join(',');
 const wall=byId('wall');wall.style.clipPath=wall.style.webkitClipPath='polygon('+outline+')';wall.style.visibility='visible';

   #stage{--wall-surface:#103326;--wall-rule:#81b997;--wall-type:#fff8dc;--wall-gold:#ffe477;--wall-font:WallFredoka,ui-rounded,"Trebuchet MS",system-ui,sans-serif}
   #stage *,#stage *::before,#stage *::after{font-family:var(--wall-font)!important}
   #stage #mainTitle,#stage .wall-host,#stage .qr-howto,#stage #chatSection .chat-header{
     color:var(--wall-gold)!important;background:var(--wall-surface)!important;font-weight:800!important;
     letter-spacing:.01em;text-shadow:none!important;-webkit-text-fill-color:currentColor
   }
   #stage #tickerWrapper .song-card,#stage .qr-row .qr-section,#stage .wall-count .total-stat{
     background:var(--wall-surface)!important;border:2px solid var(--wall-rule)!important;box-shadow:none!important
   }
   #stage #tickerWrapper :is(.card-song,.card-artist,.card-requester),#stage .shot-caption,#stage .shot-caption *,
   #stage .wall-info .wall-byline *,#stage .wall-info .wall-count *,#stage .qr-row .qr-wall-label *,
   #stage .chat-msg,#stage .chat-msg *{color:var(--wall-type)!important;text-shadow:none!important;-webkit-text-fill-color:currentColor}
   #stage .qr-row .qr-wall-label>*{background:transparent!important;border:0!important;box-shadow:none!important}
   #stage .wall-host{background:transparent!important}
   #stage .ticker-section{border:3px solid #84dbad;border-radius:16px;background:#09261c!important}
   #stage .wall-info{border:3px solid #e2bc60;border-radius:14px;background:#272918;padding-inline:.22em}
   #stage #chatSection{border:3px solid #83c9bc;border-radius:16px;background:#102d29!important}
   #stage .qr-footer{border:3px solid #ffdc68;border-radius:14px;background:#233323}
   #stage .qr-row .qr-section{border:0!important}
   #stage .wall-count .total-stat{border:0!important;background:transparent!important}
   #stage .wall-host{background:transparent!important}
   #stage#stage#stage *,#stage#stage#stage *::before,#stage#stage#stage *::after{
     font-family:var(--wall-font)!important;font-synthesis:none;
     text-shadow:0 1px 0 #123924!important
   }
   #stage .qr-wrap svg{shape-rendering:crispEdges}
   #stage .qr-wrap img.brand-code{image-rendering:pixelated}
   #stage .wall-count{position:absolute!important;box-sizing:border-box;justify-content:center;border:3px solid #e2bc60;border-radius:14px;background:#173025;gap:.4em}
   #stage .wall-count .dot{width:calc(var(--count-size)*.38);height:calc(var(--count-size)*.38);flex:none}
   #stage #tickerWrapper .song-card{padding-left:calc(10px + var(--ticket-inset,0px))}
   #stage #tickerWrapper.is-static{width:100%;margin-inline:0}
   #stage #tickerWrapper .card-num *{color:#10261b!important}

 byId('panel').hidden=byId('handles').hidden=!editing;byId('edit').hidden=editing;
 byId('label').textContent=(selected+1)+' / 5 · '+names[selected];
 points.forEach((p,i)=>{const el=byId('handles').children[i];el.style.left=p[0]+'%';el.style.top=p[1]+'%';el.classList.toggle('active',i===selected)});
}
function move(x,y){const p=points.slice();p[selected]=[x,y].map(n=>Math.max(0,Math.min(100,n)));if(valid(p))points=p;draw()}
points.forEach((_,i)=>{const el=document.createElement('button');el.className='pin';el.textContent=i+1;el.setAttribute('aria-label',names[i]);byId('handles').appendChild(el);
 el.onpointerdown=ev=>{selected=i;el.setPointerCapture(ev.pointerId);draw()};el.onpointermove=ev=>{if(el.hasPointerCapture(ev.pointerId))move(ev.clientX/innerWidth*100,ev.clientY/innerHeight*100)};el.onclick=()=>{selected=i;draw()};
});
byId('next').onclick=()=>{selected=(selected+1)%5;draw()};byId('prev').onclick=()=>{selected=(selected+4)%5;draw()};
document.querySelectorAll('[data-x],[data-y]').forEach(el=>el.onclick=()=>move(points[selected][0]+Number(el.dataset.x||0)*.25,points[selected][1]+Number(el.dataset.y||0)*.25));
byId('done').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(points))}catch{}editing=false;draw()};
byId('edit').onclick=()=>{editing=true;draw()};
byId('full').onclick=()=>{const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)fn.call(el)};
byId('show').addEventListener('load',draw);const readyTimer=setInterval(()=>{const doc=byId('show').contentDocument;if(doc&&doc.querySelector('#stage .main-content')){draw();clearInterval(readyTimer)}},200);window.addEventListener('resize',draw);draw();
</script></html>
