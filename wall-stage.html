<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaulted wall · Song and Drop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;color:#fff;font:16px system-ui,sans-serif}

<div id="wall"><svg id="art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="grooves" width="100" height="100" patternUnits="userSpaceOnUse"><g id="rings" fill="none" stroke="#39775b" stroke-width=".22"></g></pattern></defs><polygon id="edge" fill="url(#grooves)" stroke="#e9df94" stroke-width=".65"/></svg><iframe id="show" title="Song Display Main + Drop Your Shot" allow="autoplay"></iframe></div>

<script>
'use strict';
const byId=id=>document.getElementById(id);
const names=['High end of vault','Right ceiling corner','Right above pictures','Left above pictures','Outer edge of overhang'];
const initial=[[28,5],[74,39],[75,76],[26,76],[30,44]];
const key='song-drop-vault-v1';
let points=initial.map(p=>p.slice()), selected=0, saved=false;
function valid(p){
 if(!Array.isArray(p)||p.length!==5||!p.every(v=>Array.isArray(v)&&v.length===2&&v.every(n=>Number.isFinite(n)&&n>=0&&n<=100)))return false;
 const [a,b,c,d,e]=p;
 return a[1]<b[1]&&a[1]<e[1]&&e[1]<d[1]&&Math.min(c[1],d[1])-Math.max(b[1],e[1])>10&&Math.min(b[0],c[0])-Math.max(a[0],d[0],e[0])>15;
}

 arc.setAttribute('cx','29');arc.setAttribute('cy','52');arc.setAttribute('r',r);byId('rings').appendChild(arc);
}
function draw(){
 const [a,b,c,d,e]=points;

 const doc=frame.contentDocument;
 if(doc && doc.querySelector('#stage .main-content')){

   doc.head.appendChild(css);
   const labels=['Request a song','Party chat','Tip the DJ','Snapchat'];
   const codes=[["1111111000100001111010010010101111111","1000001001010110101101101101101000001","1011101010011101000111000010001011101","1011101010110000110100001111101011101","1011101010000001101110010000101011101","1000001010001010001001101011101000001","1111111010101010101010101010101111111","0000000010001010100111111001100000000","1011111001111100001110100011101111100","0110010100001001110000010110111100010","0111111010011110010010101001101110011","0101010011000100100001001011110100001","1111111111110100111000110111011111111","0000110101000110111100010100110100010","1110001101001001110001101111010111011","1010110101011011111101000010010110011","1011111101100010100001001111011010111","0011010001101111011011010100110100010","0011101111010101110100101011111010011","0111110001000111000111110001111111001","1010001010000011010100110111011011100","0010000011111000000110010000100001000","0001011001111101101010100111101111011","0100110100111000100010011001000110011","0001011000011101001011101110111010111","1010110000110111100000011100100100100","1001001001111000011011000011110110111","1011000100001110100001100001000110011","1001011100100000010010111111111110111","0000000011011000111111110110100011010","1111111000101111010001000110101010111","1000001010010110111001100010100011011","1011101010110100100101011111111110101","1011101011111111011011110111111011001","1011101011011011110101101000100000111","1000001000101011000111011010111010001","1111111010110011010100101100011011111"],["1111111001111000101100111110001111111","1000001010111000101100101100101000001","1011101010110001000111000010101011101","1011101010110001110111111101001011101","1011101001000010001110010000101011101","1000001000001100101001101110101000001","1111111010101010101010101010101111111","0000000010110001100111011000100000000","1000001011110001001111101111111001110","1011100011011010010011110110010111110","0100011100001100010010100001001000011","0010010001010011100000000010110101001","10110110001010100011    doc.querySelectorAll('.qr-section').forEach((section,i)=>{
    const rows=codes[i],size=rows.length+8;
    const path=rows.flatMap((row,y)=>Array.from(row,(bit,x)=>bit==='1'?'M'+(x+4)+' '+(y+4)+'h1v1h-1z':'')).join('');
    section.querySelector('a').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" role="img" aria-label="'+labels[i]+'"><rect width="100%" height="100%" fill="white"/><path fill="black" d="'+path+'"/></svg>';
    const label=doc.createElement('span');label.className='qr-wall-label';label.textContent=labels[i];section.appendChild(label);
   });
  }
  const pxX=x=>(x-x0)*innerWidth/100/unit,pxY=y=>(y-y0)*innerHeight/100/unit;
  const L=Math.max(...[a,d,e].map(p=>pxX(p[0])))+9,R=Math.min(pxX(b[0]),pxX(c[0]))-9;
  const base=Math.min(pxY(d[1]),pxY(c[1]))-8;
  const split=L+(R-L)*0.55;
  const roof=x=>pxY(a[1])+(x-pxX(a[0]))*(pxY(b[1])-pxY(a[1]))/(pxX(b[0])-pxX(a[0]));
  const leftRoof=Math.max(roof(L),roof(split))+8,rightRoof=Math.max(roof(split),roof(R))+8;
  const footerH=Math.min((R-L)*0.19,(base-Math.max(leftRoof,rightRoof))*0.42);
  const footerTop=base-footerH;
  const headerH=Math.min(115,(footerTop-leftRoof)*0.27);
  function box(selector,x,y,w,h){
   const el=doc.querySelector(selector);
   Object.entries({left:x,top:y,width:w,height:h}).forEach(([key,value])=>el.style.setProperty(key,value+'px','important'));
   el.style.transform='none';
  }
  box('.header',L,leftRoof,split-L,headerH);
  box('.ticker-section',L,leftRoof+headerH,split-L,footerTop-leftRoof-headerH);
  box('#chatSection',split+5,rightRoof,R-split-5,footerTop-rightRoof);
  box('.qr-footer',L,footerTop,R-L,footerH);
  doc.documentElement.style.setProperty('--code-size',Math.max(16,Math.floor(Math.min(footerH-55,(R-L)/4-16)))+'px');
 }
 byId('edit').style.left=left+'%';byId('edit').style.top=top+'%';
 byId('panel').hidden=byId('handles').hidden=!editing;byId('edit').hidden=editing;
 byId('label').textContent=(selected+1)+' / 5 · '+names[selected];
 points.forEach((p,i)=>{const el=byId('handles').children[i];el.style.left=p[0]+'%';el.style.top=p[1]+'%';el.classList.toggle('active',i===selected)});
}
function move(x,y){const p=points.slice();p[selected]=[x,y].map(n=>Math.max(0,Math.min(100,n)));if(valid(p))points=p;draw()}
points.forEach((_,i)=>{const el=document.createElement('button');el.className='pin';el.textContent=i+1;el.setAttribute('aria-label',names[i]);byId('handles').appendChild(el);
 el.onpointerdown=ev=>{selected=i;el.setPointerCapture(ev.pointerId);draw()};el.onpointermove=ev=>{if(el.hasPointerCapture(ev.pointerId))move(ev.clientX/innerWidth*100,ev.clientY/innerHeight*100)};el.onclick=()=>{selected=i;draw()};
});
byId('next').onclick=()=>{selected=(selected+1)%5;draw()};byId('prev').onclick=()=>{selected=(selected+4)%5;draw()};
document.querySelectorAll('[data-x],[data-y]').forEach(el=>el.onclick=()=>move(points[selected][0]+Number(el.dataset.x||0)*.25,points[selected][1]+Number(el.dataset.y||0)*.25));
byId('done').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(points))}catch{}editing=false;draw()};
byId('edit').onclick=()=>{editing=true;draw()};
byId('full').onclick=()=>{const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)fn.call(el)};
byId('show').addEventListener('load',draw);const readyTimer=setInterval(()=>{const doc=byId('show').contentDocument;if(doc&&doc.querySelector('#stage .main-content')){draw();clearInterval(readyTimer)}},200);window.addEventListener('resize',draw);draw();
</script></html>
