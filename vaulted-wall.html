<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaulted wall · Song and Drop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;color:#fff;font:16px system-ui,sans-serif}
#wall,#art,#handles{position:absolute;inset:0;width:100%;height:100%}#wall{visibility:hidden;background:#09251d;overflow:hidden}
iframe{position:absolute;border:0;background:#09251d}
#panel{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:14px;border:1px solid #b4f099;background:#0b211af5;border-radius:12px;text-align:center;max-width:94vw;width:max-content}button{font:inherit;padding:7px 10px;margin:3px;color:inherit;background:#234e3d;border:1px solid #729782;border-radius:6px}#handles{pointer-events:none}.pin{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);margin:0;touch-action:none;background:#173525;border:2px solid white;border-radius:50%}.pin.active{background:#fff097;color:#07170f}#edit{position:absolute;opacity:0}#edit:focus{opacity:1}[hidden]{display:none!important}small{display:block;margin:5px}
</style>
<div id="wall"><svg id="art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="grooves" width="100" height="100" patternUnits="userSpaceOnUse"><g id="rings" fill="none" stroke="#39775b" stroke-width=".22"></g></pattern></defs><polygon id="edge" fill="url(#grooves)" stroke="#e9df94" stroke-width=".65"/></svg><iframe id="show" title="Song Display Main + Drop Your Shot" allow="autoplay"></iframe></div>
<button id="edit" aria-label="Adjust wall outline">Adjust wall</button><div id="handles"></div>
<section id="panel"><strong id="label"></strong><small>Drag the points or nudge the selected point.</small><button id="prev">Previous</button><button id="next">Next</button><br><button data-x="-1">←</button><button data-y="-1">↑</button><button data-y="1">↓</button><button data-x="1">→</button><br><button id="full">Full screen</button><button id="done">Save &amp; show</button></section>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const names=['High end of vault','Right ceiling corner','Right above pictures','Left above pictures','Outer edge of overhang'];
const initial=[[28,5],[74,39],[75,76],[26,76],[30,44]];
const key='song-drop-vault-v1';
let points=initial.map(p=>p.slice()), selected=0, saved=false;
function valid(p){
 if(!Array.isArray(p)||p.length!==5||!p.every(v=>Array.isArray(v)&&v.length===2&&v.every(n=>Number.isFinite(n)&&n>=0&&n<=100)))return false;
 const [a,b,c,d,e]=p;
 return a[1]<b[1]&&a[1]<e[1]&&e[1]<d[1]&&Math.min(c[1],d[1])-Math.max(b[1],e[1])>10&&Math.min(b[0],c[0])-Math.max(a[0],d[0],e[0])>15;
}
try{const p=JSON.parse(localStorage.getItem(key));if(valid(p)){points=p;saved=true}}catch{}
const query=new URLSearchParams(location.search);
let editing=!saved||query.has('setup');query.delete('setup');
byId('show').src='index.html'+(query.toString()?'?'+query:'');
for(let r=3;r<125;r+=2.4){
 const arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
 arc.setAttribute('cx','29');arc.setAttribute('cy','52');arc.setAttribute('r',r);byId('rings').appendChild(arc);
}
function draw(){
 const [a,b,c,d,e]=points;
 const outline=points.map(p=>p[0]+'% '+p[1]+'%').join(',');
 const wall=byId('wall');wall.style.clipPath=wall.style.webkitClipPath='polygon('+outline+')';wall.style.visibility='visible';
 byId('edge').setAttribute('points',points.map(p=>p.join(',')).join(' '));
 const left=Math.max(a[0],d[0],e[0])+0.6,right=Math.min(b[0],c[0])-0.6;
 const top=Math.max(b[1],e[1])+0.6,bottom=Math.min(c[1],d[1])-0.6;
 const frame=byId('show');
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const unit=(x1-x0)*innerWidth/100/1920;
 const height=(y1-y0)*innerHeight/100/unit;
 Object.assign(frame.style,{left:x0+'%',top:y0+'%',width:'1920px',height:height+'px',transformOrigin:'0 0',transform:'scale('+unit+')',pointerEvents:editing?'none':'auto',background:'transparent'});
 const doc=frame.contentDocument;
 if(doc && doc.getElementById('stage')){
  let style=doc.getElementById('vault-fit');
  if(!style){
   style=doc.createElement('style');style.id='vault-fit';doc.head.appendChild(style);
   style.textContent=`
   html,body,#stage{background:transparent!important}
   #stage{width:100%!important;height:100%!important;transform:none!important}
   #stage>.container{position:absolute!important;inset:0!important;transform:none!important;width:100%!important;height:100%!important;padding:0!important}
   #stage .main-content,#stage .left-panel{display:contents!important}
   .jukebox-hem,.paint-bg{display:none!important}
   #stage .header,#stage .ticker-section,#stage .qr-footer,#stage #chatSection{position:absolute!important;box-sizing:border-box;margin:0!important;overflow:hidden}
   #stage .header{padding:8px;gap:4px;flex-direction:column;justify-content:center}
   #stage .header-date,#stage .header-right{position:static!important;transform:none!important}
   #stage .header-date{font-size:24px}#stage .header .title{font-size:58px}
   #stage .header .header-right{display:flex;justify-content:center}
   #stage .qr-howto{font-size:22px;letter-spacing:0}
   #stage .qr-row{flex:1;min-height:0;align-items:center}
   #stage .qr-code{width:var(--qr)!important;height:var(--qr)!important}
   `;
  }
  // Use each column's own ceiling height along the calibrated slope.
  const lx=Math.max(a[0],e[0],d[0])+0.45,rx=Math.min(b[0],c[0])-0.45;
  const mid=lx+(rx-lx)*0.56;
  const roof=x=>a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
  const floor=Math.min(c[1],d[1])-0.55;
  const topLeft=roof(mid)+0.6, topRight=roof(rx)+0.6;
  const qrTop=floor-(floor-topLeft)*0.46;
  function box(selector,l,t,r,bottom){
   const el=doc.querySelector(selector);
   const values={left:(l-x0)*innerWidth/100/unit,top:(t-y0)*innerHeight/100/unit,width:(r-l)*innerWidth/100/unit,height:(bottom-t)*innerHeight/100/unit};
   for(const k in values)el.style.setProperty(k,values[k]+'px','important');
  }
  // A narrower marquee can climb higher into the vault than a full-width header.
  const headEnd=lx+(mid-lx)*0.65;
  const headTop=roof(headEnd)+0.5;
  const songTop=Math.max(topLeft,(headTop+qrTop)/2);
  box('.header',lx,headTop,headEnd,songTop);
  box('.ticker-section',lx,songTop,mid,qrTop);
  box('.qr-footer',lx,qrTop,mid,floor);
  box('#chatSection',mid+0.25,topRight,rx,floor);
  doc.documentElement.style.setProperty('--qr',Math.max(55,Math.min((mid-lx)*innerWidth/100/unit/5.1,(floor-qrTop)*innerHeight/100/unit-175))+'px');
 }
 byId('edit').style.left=left+'%';byId('edit').style.top=top+'%';
 byId('panel').hidden=byId('handles').hidden=!editing;byId('edit').hidden=editing;
 byId('label').textContent=(selected+1)+' / 5 · '+names[selected];
 points.forEach((p,i)=>{const el=byId('handles').children[i];el.style.left=p[0]+'%';el.style.top=p[1]+'%';el.classList.toggle('active',i===selected)});
}
function move(x,y){const p=points.slice();p[selected]=[x,y].map(n=>Math.max(0,Math.min(100,n)));if(valid(p))points=p;draw()}
points.forEach((_,i)=>{const el=document.createElement('button');el.className='pin';el.textContent=i+1;el.setAttribute('aria-label',names[i]);byId('handles').appendChild(el);
 el.onpointerdown=ev=>{selected=i;el.setPointerCapture(ev.pointerId);draw()};el.onpointermove=ev=>{if(el.hasPointerCapture(ev.pointerId))move(ev.clientX/innerWidth*100,ev.clientY/innerHeight*100)};el.onclick=()=>{selected=i;draw()};
});
byId('next').onclick=()=>{selected=(selected+1)%5;draw()};byId('prev').onclick=()=>{selected=(selected+4)%5;draw()};
document.querySelectorAll('[data-x],[data-y]').forEach(el=>el.onclick=()=>move(points[selected][0]+Number(el.dataset.x||0)*.25,points[selected][1]+Number(el.dataset.y||0)*.25));
byId('done').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(points))}catch{}editing=false;draw()};
byId('edit').onclick=()=>{editing=true;draw()};
byId('full').onclick=()=>{const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)fn.call(el)};
byId('show').addEventListener('load',draw);window.addEventListener('resize',draw);draw();
</script></html>
